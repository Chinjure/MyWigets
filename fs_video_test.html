<!doctype html><html><head><meta charset="utf-8"><title>FS-VIDEO-TEST</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}
#v{width:100vw;height:100vh;object-fit:contain;background:#000}</style></head>
<body><video id="v" autoplay muted loop playsinline
  src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
<script>
// 网页内"全屏视频"= HTML5 Fullscreen API（与视频网站点击全屏按钮同一条路径）
const v = document.getElementById('v');
function go(){ if(!document.fullscreenElement){ v.requestFullscreen && v.requestFullscreen(); } }
window.addEventListener('load', () => setTimeout(go, 1200));
document.addEventListener('click', go);
</script></body></html>
